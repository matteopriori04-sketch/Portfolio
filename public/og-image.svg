<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Matteo Priori — Computer Engineering @ Sapienza">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F12"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Monogram chip -->
  <rect x="80" y="80" width="92" height="92" rx="20" fill="#15191E" stroke="#262C33"/>
  <text x="126" y="138" text-anchor="middle"
        font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="700"
        letter-spacing="-1" fill="#14B8A6">MP</text>

  <!-- Eyebrow -->
  <text x="82" y="320" font-family="'JetBrains Mono', monospace" font-size="22"
        letter-spacing="4" fill="#14B8A6">CYBERSECURITY · AI</text>

  <!-- Name -->
  <text x="80" y="400" font-family="'Space Grotesk', system-ui, sans-serif" font-size="76"
        font-weight="700" letter-spacing="-2" fill="#E7ECEF">Matteo Priori</text>

  <!-- Role -->
  <text x="82" y="458" font-family="'Inter', system-ui, sans-serif" font-size="30"
        fill="#9CA3AF">Computer Engineering @ Sapienza University of Rome</text>

  <!-- Footer accent line -->
  <rect x="82" y="520" width="120" height="4" rx="2" fill="#14B8A6"/>
</svg>

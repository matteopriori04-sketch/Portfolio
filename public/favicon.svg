<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MP monogram">
  <!-- Rounded zinc square background -->
  <rect width="64" height="64" rx="14" fill="#0B0F12"/>
  <!-- Teal monogram -->
  <text x="50%" y="50%" dy="0.07em" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1" fill="#14B8A6">MP</text>
  <!-- Accent dot -->
  <circle cx="50" cy="46" r="2.6" fill="#14B8A6"/>
</svg>
